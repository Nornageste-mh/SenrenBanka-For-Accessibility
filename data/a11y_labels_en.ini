# a11y_labels_en.ini —— 界面语言 = English 时加载的标签
#
# 来源：把界面语言切到 English 后逐屏截图，对着控件坐标逐项抄的（截图 en_02_set0..7 /
#       en_03_save / en_00_title），**不是翻译**。
#
# 分工：
#   · 工具栏 / 键盘页 / 鼠标页那 23 个动作名**不在这里、也不需要** ——
#     插件直接读游戏原生菜单栏的 caption（src\a11y6.cpp 的 FetchMenuLabels），
#     四语自动、永远跟着界面语言走。
#   · 这里放菜单栏**没有**的东西：设置界面各页的选项行、标题菜单、存档界面、底部按钮。
#   · 本文件没覆盖到的层名会退回内建中文。
#
# 已知未核对：
#   · `sysvo6` / `ch6`（駒川 みづは）在英文截图里那一格没看清，**故意不写**，
#     保持中文退回，等重新截图确认再补。
#   · `home` / `end` / `slider`（回忆界面的滚动控件）没有英文截图证据，同样不写。

