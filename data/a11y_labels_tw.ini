# a11y_labels_tw.ini —— 界面语言 = 繁體中文 时加载的标签
#
# 来源：把界面语言切到 Traditional Chinese 后逐屏截图，对着控件坐标逐项抄的
#       （截图 tw_00_title / tw_p0 / tw_02_set1..7 / tw_03_save），**不是简繁转换**。
#       简繁转换不能用：StrConv 会把「游戲」转成「游戲」（应为「遊戲」），
#       而这作繁体的实际用词也自成一格（遊戲設置 / 鼠標 / 單擊）。
#
# 分工：工具栏・键盘页・鼠标页那 23 个动作名由插件直接读游戏原生菜单栏 caption，
#       不在这里。这里放菜单栏没有的：设置各页选项行、标题菜单、存档界面、底部按钮。
#
# 已知未做：保存/读档界面那排翻页按钮（page_top / page_dw* / page_up* / page_end 等）
#       没有拍到繁体截图，保持中文退回。

