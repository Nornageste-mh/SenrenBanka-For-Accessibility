# a11y_speech.ini —— 语音后端与切换快捷键（UTF-8，可用记事本编辑）
#
# 放到 <游戏目录>\plugin\a11y_speech.ini（也可以放在游戏 exe 同目录）。
# 两份都没有时用默认值：key=F9、backend=auto（自动）。
#
# 用法：按 F9 循环切换语音后端。插件会把当前选择写回这个文件的 backend= 一行
# （其余行原样保留，包括下面的注释和你自己改的 key=），所以下次启动还是同一个后端。
#
#   key=F9          切换快捷键。主键限 F1..F24、A..Z、0..9，可以带修饰键，
#                   写法如 Alt+Shift+F9、Ctrl+F9。
#                   修饰键必须**完全一致**才算：写 key=F9 时按 Alt+F9 不触发。
#                   解析不了的值会被忽略并保留默认 F9（诊断日志里有一行说明）。
#   backend=auto    上次选定的后端：auto（自动）/ tolk / nvda / zdsr / sapi，
#                   另外也认「自动」「争渡」这两种中文写法。
#
# 切换顺序：自动 → Tolk → NVDA → 争渡(ZDSR) → SAPI → 回到自动。
# **当前不可用的后端会被跳过**，并在播报里说明跳过了哪些。
#
# 争渡读屏的 dll（ZDSRAPI.dll）**不由本补丁分发**，也不复制到游戏目录：
# 插件按官方建议直接读争渡安装目录下那一份。装没装、有没有授权由插件自己判，
# 不可用时如实降级到下一级后端，不会报错、也不会中止。
#
# 删掉本文件即恢复默认（F9、自动）。
key=F9
backend=auto
