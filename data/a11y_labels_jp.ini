# a11y_labels_jp.ini —— 界面语言的日文标签（游戏 UI 语言 = 日本語 时加载）
#
# 来源：把游戏界面语言切到「日本語」，逐屏截图对着控件坐标逐项抄下来的，
#       不是翻译、不是猜的。对应截图见 CHANGELOG 0.0.0.4 一节。
#       插件在 plugin\a11y_labels_jp.ini 找到它就会覆盖内建（中文）表。
#
# 本文件没覆盖到的层名会退回内建的中文标签（那几个界面还没截日文图）。
# 想改直接改这里，不用重新编译。

