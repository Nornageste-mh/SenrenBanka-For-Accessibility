# a11y_labels.ini —— 界面控件的中文标签（UTF-8，可用记事本编辑）
#
# 左边是「层名」（探针从游戏里读到的原始名字），右边是念出来的中文。
# 这里的条目会**覆盖**插件内置的那张表，所以发现念错了、或者念英文，
# 直接在这里加一行就行，不用重新编译。
#
#   copy=复制存档
#
# 想找出某个控件叫什么：按 Tab 进导航模式，用上下键听它现在念什么，
# 或者看诊断日志 D:\a11yb\a11y5_diag.txt 里 scan 之后的那一段。
#
# ============================================================================
# 设置界面这一段的依据：实机截图（shots\settings_map.png）+ 探针转储的 40 项
#   坐标对照。每个选项是**两个独立子控件**，左右各一个，所以左右两半各有标签。
#   层名描述的是底层标志位，画面上显示的是人话，两者有时相反：
#     noeff_off（左，画面高亮）＝ 画面效果 开；noeff_on（右）＝ 画面效果 关
#     （因为底层标志叫 noEffect，「关掉特效」= noeffect=true）
#   依据：设置界面转储 noeff_off@(423,526) noeff_on@(627,526)，截图同一行
#         左格写 ON 且高亮、右格写 OFF。
# ============================================================================

# ---- 读档 / 存档界面 ----
copy=複製存檔
move=替換存檔
edit=編輯註釋
del=刪除存檔
thumbview=顯示縮圖
edithold=選中編輯按鈕
title=回到標題界面
title2=回到標題界面
to_quick=快速讀檔
to_voice=語音收藏夾
slider=捲動軸
page_up1=上一頁
page_up10=往前十頁
page_add=下一頁
page_end=最後一頁

# ---- 设置界面：顶部页签（8 个，从左到右；坐标 611/779/948/1115/1284/1451/1619/1787）----
page0=画面显示
page1=游戏设置 1
page2=游戏设置 2
page3=文本
page4=音频
page5=确认
page6=鼠标
page7=键盘

# ---- 设置界面：左列第 1 行「显示模式」----
window=显示模式：窗口
fullscreen=显示模式：全屏

# ---- 左列第 2 行「画面比例」----
sqr_on=画面比例：4:3
sqr_off=画面比例：16:9

# ---- 左列第 3 行「画面效果」----
noeff_off=画面效果：开
noeff_on=画面效果：关

# ---- 左列第 4 行「动画效果」----
bganim_on=动画效果：开
bganim_off=动画效果：关

# ---- 左列第 5 行「ESC 键功能」----
esc_cancel=ESC 键功能：鼠标右键
esc_boss=ESC 键功能：老板键

# ---- 左列第 6 行「老板键功能」----
boss_min=老板键功能：最小化
boss_img1=老板键功能：图片 1
boss_img2=老板键功能：图片 2
boss_user=老板键功能：用户指定

# ---- 右列：「让游戏画面始终位于最前」----
topmost_on=总在最前：开
topmost_off=总在最前：关

# ---- 右列：「功能区域开关」（4 个独立开关）----
asicon=功能区域：状态图标
showprog=功能区域：进度条
showmenu=功能区域：窗口菜单
touchmode=功能区域：触控按钮

# ---- 右列：两条时间滑条（左右方向键调整）----
chaphidetime=章节标题显示时间
mushidetime=背景音乐曲名显示时间

# ---- 右列：「显示说话人表情」----
facemode_on=显示说话人表情：开
facemode_off=显示说话人表情：关

# ---- 底部按钮 ----
back=回到游戏
reset=恢复默认设置

# ---- 游戏内底部工具栏 ----
hold=保持
custom=自定义
save=存档
qsave=快速存档
qload=快速读档
option=设置
