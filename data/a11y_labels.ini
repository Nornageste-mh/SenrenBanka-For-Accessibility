# a11y_labels.ini —— 界面控件的中文标签（UTF-8，可用记事本编辑）
#
# 左边是「层名」（探针从游戏里读到的原始名字），右边是念出来的中文。
# 这里的条目会**覆盖**插件内置的那张表。所以这个文件的定位是「改口供」，
# 不是「抄一份内置表」—— 抄一份的后果是内置表更新了、这里还留着旧说法，
# 反而把新标签盖回去（0.0.0.2 就踩过：这里留着 slider=捲動軸、custom=自定义）。
#
# 用法：发现念错了、或者念出英文层名，就照下面格式加一行，不用重新编译。
#
#   copy=复制存档
#   page_add=下一页
#   skip_key1=快速模式 主键
#
# 想找出某个控件叫什么：按 Tab 进导航模式，用上下键听它现在念什么，
# 或者看诊断日志 D:\a11yb\a11y5_diag.txt 里 scan 之后的那一段。
#
# ============================================================================
# 内置表已经覆盖的界面（0.0.0.2 起），一般不需要在这里重复：
#   标题菜单 / 游戏内底部工具栏 / 读档存档界面 / 设置界面全部 8 个页签
#   （含键盘页 24 个动作的主副键、鼠标页 20 个手势功能）/
#   自定义按钮排列（只有位置说法）/ 回忆（历史记录）界面 / 启动注意声明
# 依据都写在 src\a11y6.cpp 的 g_alias 注释里：层名来自实机探针转储，
# 中文来自逐页截图逐项对照；成对控件的 _on/_off 后缀用实点改值验证过。
# ============================================================================
